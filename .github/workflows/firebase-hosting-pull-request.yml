# This file was auto-generated by Fleetonix Assistant to enable Pull Request Previews
name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Functions Dependencies
        run: |
          cd functions
          npm install
      - name: Deploy to Firebase Hosting (Preview)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPFLEETONIX }}'
          projectId: appfleetonix
          channelId: live
        # We use 'live' for the production branch in the other file, but for PRs, 
        # the action-hosting-deploy automatically creates a preview channel if no channelId is specified 
        # or if it's a pull_request. 
        # Actually, if I omit channelId, it creates a preview.
