# This file was auto-generated by Fleetonix Assistant to enable Automatic Deployment
name: Deploy to Firebase Hosting on Merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          cd functions
          npm install
      - name: Check Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPFLEETONIX }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_APPFLEETONIX secret is missing or empty!"
            exit 1
          fi
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPFLEETONIX }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPFLEETONIX }}'
          projectId: appfleetonix
          channelId: live
      - name: Create Functions Env
        run: echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" > functions/.env
      - name: Deploy to Firebase Functions
        run: npx firebase-tools deploy --only functions --project appfleetonix --non-interactive --force --debug
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
