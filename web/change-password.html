<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Fleetonix</title>
    <link rel="icon" type="image/jpeg" href="img/logo.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container" style="max-width: 500px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="img/logo.jpg" alt="Fleetonix Logo" class="logo-main" style="width: 100px; height: 100px; border-radius: 50%;">
            <h2 style="color: var(--text-main); margin-top: 15px;">Security Required</h2>
            <p style="color: var(--text-secondary);">Please set a new password to continue</p>
        </div>
        
        <div class="login-card">
            <div id="alertBox" class="alert" style="display: none; padding: 15px; border-radius: 8px; margin-bottom: 20px; align-items: center; gap: 10px; background-color: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.3); color: #ff6b6b;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="alertMsg"></span>
            </div>
            
            <form id="changePasswordForm">
                <div class="input-group" style="margin-bottom: 20px;">
                    <label class="input-label" style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 500;">New Password</label>
                    <div class="input-icon-wrapper" style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 15px; top: 16px; color: var(--text-muted);"></i>
                        <input type="password" id="newPassword" class="form-input" style="padding-left: 45px; width: 100%; box-sizing: border-box;" placeholder="Enter new password" required minlength="6">
                    </div>
                </div>
                
                <div class="input-group" style="margin-bottom: 30px;">
                    <label class="input-label" style="display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 500;">Confirm Password</label>
                    <div class="input-icon-wrapper" style="position: relative;">
                        <i class="fas fa-check-circle" style="position: absolute; left: 15px; top: 16px; color: var(--text-muted);"></i>
                        <input type="password" id="confirmPassword" class="form-input" style="padding-left: 45px; width: 100%; box-sizing: border-box;" placeholder="Confirm new password" required minlength="6">
                    </div>
                </div>
                
                <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%;">
                    Update Password
                </button>
            </form>
        </div>
    </div>
    
    <script type="module" src="assets/js/change-password.js"></script>
    <script src="assets/js/utils.js"></script>
</body>
</html>
