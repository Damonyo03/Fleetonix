<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetonix - Registration Disabled</title>
    <link rel="icon" type="image/jpeg" href="img/logo.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .disabled-message {
            text-align: center;
            padding: 40px;
            max-width: 500px;
            margin: 100px auto;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body class="login-body">
    <div class="disabled-message shadow-lg">
        <img src="img/logo.jpg" alt="Logo" style="width: 80px; margin-bottom: 20px;">
        <h2 style="color: var(--text-primary); margin-bottom: 16px;">Registration Disabled</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">
            Public driver registration is currently disabled. 
            Please contact your Fleet Administrator to have an account created for you.
        </p>
        <button class="btn btn-primary" onclick="window.location.href='login.html'">Back to Login</button>
    </div>
</body>
</html>
