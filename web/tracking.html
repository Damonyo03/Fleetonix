<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetonix - Live Trip Tracking</title>
    <link rel="icon" type="image/jpeg" href="img/logo.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e14;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d4ff;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(10, 14, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        .tracking-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--accent-blue);
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-live::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            70% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        .info-group {
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .location-stepper {
            position: relative;
            padding-left: 25px;
            margin-top: 20px;
        }

        .location-stepper::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--glass-border);
        }

        .step {
            position: relative;
            margin-bottom: 20px;
        }

        .step::after {
            content: '';
            position: absolute;
            left: -22px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            background: var(--bg-dark);
        }

        .step.active::after {
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .footer-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 500px;
            z-index: 10;
        }

        .driver-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .driver-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            object-fit: cover;
        }

        .btn-call {
            background: var(--accent-blue);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .overlay { top: 10px; left: 10px; right: 10px; }
            .glass-card { max-width: none; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="font-size: 0.9rem; letter-spacing: 0.1em; color: var(--text-muted);">INITIALIZING TRACKING STREAM</p>
    </div>

    <div id="map"></div>

    <header class="overlay">
        <div class="glass-card">
            <div class="tracking-header">
                <img src="img/logo.jpg" alt="Fleetonix" class="logo">
                <div>
                    <div style="font-weight: 700; font-size: 1.1rem;">Trip Tracker</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);" id="trip-id-display">TRIP-ID: ...</div>
                </div>
                <div class="badge-live" style="margin-left: auto;">Live</div>
            </div>

            <div class="location-stepper">
                <div class="step">
                    <div class="info-label">Pickup Point</div>
                    <div class="info-value" id="pickup-text" style="font-size: 0.9rem;">Fetching location...</div>
                </div>
                <div class="step active">
                    <div class="info-label">Destination</div>
                    <div class="info-value" id="dropoff-text" style="font-size: 0.9rem;">Fetching location...</div>
                </div>
            </div>
        </div>
    </header>

    <div class="footer-card">
        <div class="glass-card" style="max-width: none;">
            <div class="driver-info">
                <img src="img/driver-placeholder.png" id="driver-avatar" class="driver-avatar" alt="Driver">
                <div>
                    <div class="info-label">Transport Officer</div>
                    <div class="info-value" id="driver-name">Connecting...</div>
                    <div style="font-size: 0.8rem; color: var(--accent-blue);" id="vehicle-details">...</div>
                </div>
                <a href="#" id="call-link" class="btn-call">
                    <i class="fas fa-phone"></i> Call
                </a>
            </div>
        </div>
    </div>

    <!-- Google Maps JS API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWal4kXhImWNvJL2jV4LG0FvftdN2J9DQ"></script>

    <!-- Firebase SDKs -->
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
          }
        }
    </script>
    <script type="module" src="assets/js/tracking.js"></script>
</body>
</html>
